<!doctype html>
<html><head><meta charset="utf-8"><title>uhh bigapps</title></head>
<body>
<!-- Served by scripts/regress.py (--bigapps) to headless Edge (--dump-dom). The JS result is
     verified by the suite, as are 40 synchronous requests to the local server; /slow (a parser-blocking
     script streamed over the run) then holds the load event open, so the browser process stays busy (IPC, allocations, file and
     network I/O) for the whole run. -->
<div id="js">pending</div>
<div id="fetched">FETCHED=0</div>
<div id="async">ASYNC ok=0 fail=0 sent=0</div>
<div id="slow">SLOW=pending</div>
<script>
function work(n) { let h = 0; for (let i = 0; i < n; i++) h = (h * 31 + (i ^ (i >> 3))) | 0; return h; }
let r = 0;
for (let k = 0; k < 20; k++) r = (r + work(50000 + k)) | 0;
const frag = document.createDocumentFragment();
for (let i = 0; i < 20000; i++) { const p = document.createElement('p'); p.textContent = 'row' + i; frag.appendChild(p); }
document.getElementById('js').textContent = 'BIGAPPS_JS=' + r + ' nodes=' + frag.childNodes.length;
// Synchronous requests: parsing (and so the load event / --dump-dom) waits for every one.
const FETCHES = 40;
let got = 0;
for (let i = 0; i < FETCHES; i++) {
  const x = new XMLHttpRequest();
  x.open('GET', '/data?i=' + i, false);
  try { x.send(); if (x.status === 200 && x.responseText === 'data' + i) got++; } catch (e) {}
}
document.getElementById('fetched').textContent = 'FETCHED=' + got;
// While /slow (below) blocks the parser, timers still run: keep the browser's network,
// IPC and allocator busy during the hold with a BOUNDED set of ASYNC_N requests (one per
// 100 ms; the server sizes ASYNC_N to the first half of the hold), each a new loopback
// connection. Every one is counted as ok or fail: the suite requires ok=ASYNC_N fail=0.
const ASYNC_N = __ASYNC_N__;
let asyncOk = 0, asyncFail = 0, asyncSent = 0;
function showAsync() {
  document.getElementById('async').textContent = 'ASYNC ok=' + asyncOk + ' fail=' + asyncFail + ' sent=' + asyncSent;
}
const asyncTimer = setInterval(() => {
  if (asyncSent >= ASYNC_N) { clearInterval(asyncTimer); return; }
  const i = asyncSent++;
  fetch('/data?i=' + i, {cache: 'no-store'})
    .then(x => x.ok ? x.text() : Promise.reject(new Error('status ' + x.status)))
    .then(t => { if (t === 'data' + i) asyncOk++; else asyncFail++; showAsync(); },
          () => { asyncFail++; showAsync(); });
  showAsync();
}, 100);
</script>
<!-- Parser-blocking script streamed slowly: the load event (and --dump-dom) waits for all of
     it, and its last line proves it arrived complete. -->
<script src="/slow"></script>
</body></html>

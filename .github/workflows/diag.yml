# TEMPORARY diagnostics for the runner-only failures of the first CI runs (removed after use).
name: runner-diag
on:
  push:
    branches: [ci]
    paths: ['.github/workflows/diag.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build
        shell: pwsh
        run: |
          $platform = @{ x64 = 'x64'; x86 = 'Win32' }['${{ matrix.arch }}']
          cmake -S . -B b -G "Visual Studio 17 2022" -A $platform | Out-Null
          cmake --build b --config Release --parallel | Select-String ': error|LNK[0-9]' | Select -First 5
      - name: patch-race attach timing
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          import subprocess, sys, time, json
          B = sys.argv[1]
          out = []
          for mode in ("frozen", "unsafe"):
              t = subprocess.Popen([B + r"\patchrace_target.exe", "--threads", "8", "--seconds", "40"], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              t.stdout.readline()
              for i in range(6):
                  if t.poll() is not None: break
                  cmd = [B + r"\uhh_trace.exe", "--backend", "inline", "--attach", str(t.pid), "--detach-after-ms", "400", "-p", "patchrace_target.exe!RaceSite:-"]
                  if mode == "unsafe": cmd.insert(1, "--unsafe-fast-patch")
                  t0 = time.time()
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=120)
                  pr = next((json.loads(l) for l in r.stdout.splitlines() if '"kind": "probe"' in l or '"kind":"probe"' in l), {})
                  err = " | ".join(r.stderr.strip().splitlines()[-4:])
                  out.append(f"{mode} cycle{i} {time.time()-t0:.2f}s rc={r.returncode} hits={pr.get('hits')} backend={pr.get('backend')} stderr: {err[:300]}")
              t.kill()
          print("\n".join(out))
          print("::notice title=patchrace ${{ matrix.arch }}::" + "%0A".join(out))
          '@ | Out-File -Encoding utf8 $env:RUNNER_TEMP\pr.py
          python $env:RUNNER_TEMP\pr.py "$pwd\b\Release"
      - name: ps-fileversion (32-bit powershell, plain)
        continue-on-error: true
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          $ps = "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe"
          $o = & $ps -NoProfile -Command 'Get-Process -FileVersionInfo -EA SilentlyContinue | % { $_.FileName } | sort' 2>&1 | Out-String
          $rc = $LASTEXITCODE
          $wow = Get-Process | ? { try { $_.Modules.ModuleName -contains 'wow64.dll' } catch { $false } } | % { $_.ProcessName }
          $msg = "rc=$rc rows=$(($o -split "`n" | ? { $_.Trim() }).Count) wow64_procs=[$($wow -join ',')] out=$($o.Substring(0,[math]::Min(300,$o.Length)))"
          Write-Output $msg
          Write-Output "::notice title=ps-fileversion x86 plain::$($msg -replace "`r?`n",' / ')"
      - name: repeat the failing checks
        continue-on-error: true
        shell: pwsh
        run: |
          $sets = @(
            @{ n = 5; only = 'check_stream_latency'; env = '' },
            @{ n = 8; only = 'check_ret_probe'; env = '' },
            @{ n = 4; only = 'check_crash_logs'; env = '' },
            @{ n = 2; only = 'check_patch_race'; env = '' },
            @{ n = 4; only = 'check_lifecycle'; env = 'controller-killed' }
          )
          $lines = @()
          foreach ($s in $sets) {
            $env:UHH_LC = $s.env
            for ($i = 1; $i -le $s.n; $i++) {
              $o = python -u scripts/regress.py --bin b/Release --only $s.only 2>&1
              $f = $o | Select-String '^\[\d\d:\d\d:\d\d\] FAIL' | % { "$_".Substring(11) }
              $ok = $o | Select-String '^\d+/\d+ ok' | % { "$_" }
              $lines += "$($s.only)#$i $ok"
              $lines += $f | % { "   $_".Substring(0, [math]::Min(330, "   $_".Length)) }
              $o | Out-File -Append -Encoding utf8 diag-${{ matrix.arch }}.log
            }
          }
          $lines | Write-Output
          Write-Output ("::notice title=repeats ${{ matrix.arch }}::" + ($lines -join '%0A'))
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diag-${{ matrix.arch }}
          path: diag-*.log

# UHH regression suite on GitHub-hosted windows-2022 runners (x64 + x86), sharded.
# How to trigger and read results: docs/ROADMAP.md, "CI on GitHub Actions".
# Jobs: plan -> build (x64, x86) -> test <arch>-<NN> shards -> summary; cet-hw (windows-2025, enforced CET) alongside.
name: windows-regress

on:
  push:
    branches: ['**']
    paths:
      - '**'
      - '!**.md'
      - 'docs/quickstart.md'          # check_quickstart compares it with examples/quickstart
      - '!measurements/**'
      - '!bench/frida/**'                # Frida comparison scripts: workflow bench-frida.yml
      - '!.github/workflows/bench-frida.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: 'regress.py --only selectors, comma-separated (substrings of check_* names); empty = full suite'
        default: ''
        required: false
      arches:
        description: 'x64,x86 | x64 | x86'
        default: 'x64,x86'
        required: false
      shards:
        description: 'shards per arch (0 = default: x64 7, x86 9)'
        default: '0'
        required: false
      image:
        description: 'runner image: windows-2022 (no CET in the guest) | windows-2025 (CET shadow stacks ENFORCED, AMD EPYC)'
        default: 'windows-2022'
        required: false

concurrency:
  group: regress-${{ github.event_name }}-${{ github.ref }}-${{ inputs.only }}-${{ inputs.arches }}-${{ inputs.image }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      arches: ${{ steps.m.outputs.arches }}
      image: ${{ steps.m.outputs.image }}
      cet: ${{ steps.m.outputs.cet }}
    steps:
      - uses: actions/checkout@v6
      - id: m
        env:
          ONLY: ${{ inputs.only }}
          ARCHES: ${{ inputs.arches || 'x64,x86' }}
          SHARDS: ${{ inputs.shards || '0' }}
          IMAGE: ${{ inputs.image || 'windows-2022' }}   # pushes and pull requests: windows-2022
        run: |
          case "$IMAGE" in windows-20[0-9][0-9]) ;; *) echo "bad image $IMAGE"; exit 1;; esac
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          # cet-hw: on every push / PR; on a dispatch only when the selection includes the CET checks
          case ",$ONLY," in ",,"|*cet*) echo "cet=true" >> "$GITHUB_OUTPUT";; *) echo "cet=false" >> "$GITHUB_OUTPUT";; esac
          python3 scripts/ci_shards.py matrix --only "$ONLY" --arches "$ARCHES" --shards "$SHARDS" --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ${{ needs.plan.outputs.image }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        shell: pwsh
        run: |
          $platform = @{ x64 = 'x64'; x86 = 'Win32' }['${{ matrix.arch }}']
          # The VM's generator; windows-2025 images ship a newer Visual Studio only -> its default VS generator.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -version '[17.0,18.0)' -property installationPath
          if ($vs) { cmake -S . -B build-${{ matrix.arch }} -G "Visual Studio 17 2022" -A $platform }
          else { cmake -S . -B build-${{ matrix.arch }} -A $platform }
          $cl = Get-Content build-${{ matrix.arch }}\CMakeCache.txt | Select-String 'CMAKE_GENERATOR:|CMAKE_CXX_COMPILER:' | % { "$_" }
          Write-Output "::notice title=toolchain ${{ matrix.arch }}::$($cl -join ' ')"
      - name: Build (Release)
        run: cmake --build build-${{ matrix.arch }} --config Release --parallel
      - name: Runner facts + CET probe
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $os = Get-CimInstance Win32_OperatingSystem
          $facts = "cpu=$($cpu.Name.Trim()) cores=$($cpu.NumberOfCores) lp=$($cpu.NumberOfLogicalProcessors) ram=$([math]::Round($os.TotalVisibleMemorySize/1MB,1))GB os=$($os.Caption) $($os.Version)"
          $mp = try { (Get-MpComputerStatus).RealTimeProtectionEnabled } catch { 'n/a' }
          $facts += " defender_rt=$mp"
          $cet = & "build-${{ matrix.arch }}\Release\cet_probe.exe" 2>&1 | Out-String
          $cet = $cet.Trim()
          Write-Output $facts
          Write-Output $cet
          Write-Output "::notice title=runner ${{ matrix.arch }}::$facts"
          Write-Output "::notice title=cet_probe ${{ matrix.arch }}::$cet"
          "### Runner ${{ matrix.arch }}`n`n$facts`n`n``````json`n$cet`n```````n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v6
        with:
          name: bin-${{ matrix.arch }}
          path: |
            build-${{ matrix.arch }}/Release/
            !build-${{ matrix.arch }}/Release/**/*.ilk
          if-no-files-found: error
          retention-days: 7

  # windows-2025 hosted runners (AMD EPYC, Server 2025 build 26100) ENFORCE user-mode CET shadow stacks for
  # /CETCOMPAT processes (cet_probe: enforced=true, EnableUserShadowStack=1, SetContextIpValidation=1); the
  # windows-2022 guests expose no CET. So every push also runs the CET checks on real CET hardware.
  cet-hw:
    needs: plan
    if: needs.plan.outputs.cet == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CI_NOTICE_RE: '\] (PASS|SKIP|FAIL)  (cet-|conformance)'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build x64 (default VS generator; this image has no VS 2022)
        shell: pwsh
        run: |
          cmake -S . -B build-x64 -A x64
          cmake --build build-x64 --config Release --parallel
      - name: CET probe
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()
          $os = Get-CimInstance Win32_OperatingSystem
          $cet = (& build-x64\Release\cet_probe.exe 2>&1 | Out-String).Trim()
          Write-Output "$cpu / $($os.Caption) $($os.Version)"; Write-Output $cet
          Write-Output "::notice title=cet_probe windows-2025::$cpu / $($os.Caption) $($os.Version) $cet"
      - name: Cache Intel SDE 9.48
        uses: actions/cache@v5
        with:
          path: C:\tools\sde-dl
          key: sde-9.48.0-2024-11-25-win
      - name: Intel SDE 9.48 at C:\tools\sde (check_cet selects check_cet_sde too)
        shell: pwsh
        run: |
          $f = 'C:\tools\sde-dl\sde-external-9.48.0-2024-11-25-win.tar.xz'
          if (-not (Test-Path $f)) {
            New-Item -ItemType Directory -Force C:\tools\sde-dl | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://downloadmirror.intel.com/843185/sde-external-9.48.0-2024-11-25-win.tar.xz' -OutFile $f
          }
          $h = (Get-FileHash -Algorithm SHA256 $f).Hash
          if ($h -ne '022A1F2ED545E3BD7E301B8B3D3E40201EB2D95426D137704BE54EDC2E5CBCBF') { Remove-Item $f; throw "SDE sha256 mismatch: $h" }
          7z x -y -oC:\tools\sde-x $f | Out-Null
          7z x -y -oC:\tools\sde-x C:\tools\sde-x\sde-external-9.48.0-2024-11-25-win.tar | Out-Null
          Move-Item C:\tools\sde-x\sde-external-9.48.0-2024-11-25-win C:\tools\sde
      - name: regress.py check_cet,check_conformance under enforced CET
        run: python -u scripts/ci_shards.py run --arch x64 --units "check_cet,check_conformance" --bin build-x64/Release --out ci-logs --name cet-hw-x64
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-cet-hw-x64
          path: ci-logs/
          retention-days: 14

  test:
    needs: [plan, build]
    runs-on: ${{ needs.plan.outputs.image }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: test ${{ matrix.name }} (${{ needs.plan.outputs.image }})
    env:
      CI_IMAGE: ${{ needs.plan.outputs.image }}   # ci_shards.py ABSENT: OS components this image does not ship
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: bin-${{ matrix.arch }}
          path: build-${{ matrix.arch }}/Release
      - name: Runner CPU (failures can depend on the host model; recorded per shard)
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim() -replace '\s+', ' '
          "RUNNER_CPU=$cpu" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Defender exclusion for the workspace (as on the test VM, which excludes C:\work)
        shell: pwsh
        run: |
          try { Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE } catch { Write-Output "no Defender: $_" }
      - name: Frida 16.5.9 venv at C:\work\fv16 (regress FRIDA_PY)
        if: matrix.frida
        shell: pwsh
        run: |
          python -m venv C:\work\fv16
          C:\work\fv16\Scripts\python.exe -m pip install --disable-pip-version-check -q frida==16.5.9
          C:\work\fv16\Scripts\python.exe -c "import frida; print('frida', frida.__version__)"
      - name: Cache Intel SDE 9.48
        if: matrix.sde
        uses: actions/cache@v5
        with:
          path: C:\tools\sde-dl
          key: sde-9.48.0-2024-11-25-win
      - name: Intel SDE 9.48 at C:\tools\sde (regress SDE_EXE; the last Windows kit with the CET checker)
        if: matrix.sde
        shell: pwsh
        run: |
          $f = 'C:\tools\sde-dl\sde-external-9.48.0-2024-11-25-win.tar.xz'
          if (-not (Test-Path $f)) {
            New-Item -ItemType Directory -Force C:\tools\sde-dl | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://downloadmirror.intel.com/843185/sde-external-9.48.0-2024-11-25-win.tar.xz' -OutFile $f
          }
          $h = (Get-FileHash -Algorithm SHA256 $f).Hash
          if ($h -ne '022A1F2ED545E3BD7E301B8B3D3E40201EB2D95426D137704BE54EDC2E5CBCBF') { Remove-Item $f; throw "SDE sha256 mismatch: $h" }
          7z x -y -oC:\tools\sde-x $f | Out-Null
          7z x -y -oC:\tools\sde-x C:\tools\sde-x\sde-external-9.48.0-2024-11-25-win.tar | Out-Null
          Move-Item C:\tools\sde-x\sde-external-9.48.0-2024-11-25-win C:\tools\sde
          & C:\tools\sde\sde.exe -version
      # check_oldcrt needs a pre-14.40 msvcp140.dll of the target's bitness. windows-2022 has one (VS 2022's bundled
      # LLVM: the check's own default lookup); newer images do not (VS 2026's LLVM ships none). There: the 14.29.30133
      # redistributable DLL from the PyPI wheel msvc-runtime (sha256-pinned), via regress UHH_OLD_MSVCP.
      - name: Old msvcp140 14.29 (check_oldcrt; images without one)
        if: matrix.oldmsvcp && needs.plan.outputs.image != 'windows-2022'
        shell: pwsh
        run: |
          $w = @{
            x64 = @('5c/cb/0c91c4cecc540ef9995d5274a8444cb2003119f7d36d098ed2e99e5e86dd/msvc_runtime-14.29.30133-cp39-cp39-win_amd64.whl', '957B1F1353D2E682F7B496CCE8D55DD836F397C984AA52A64C9378CD04DEBB22');
            x86 = @('d2/4b/89e86f51e7f8447c38cc180cd4562b3865ada217e207384db193ebfcc448/msvc_runtime-14.29.30133-cp39-cp39-win32.whl', 'D486D45D466598D52BB53FE663E60676109DEDE8105DEA09A7C9B2A5B9E80A57')
          }['${{ matrix.arch }}']
          New-Item -ItemType Directory -Force C:\tools\oldmsvcp | Out-Null
          $f = 'C:\tools\oldmsvcp\msvc_runtime.zip'
          Invoke-WebRequest -UseBasicParsing -Uri "https://files.pythonhosted.org/packages/$($w[0])" -OutFile $f
          $h = (Get-FileHash -Algorithm SHA256 $f).Hash
          if ($h -ne $w[1]) { throw "msvc-runtime wheel sha256 mismatch: $h" }
          Expand-Archive -Force $f C:\tools\oldmsvcp\x
          $dll = 'C:\tools\oldmsvcp\x\msvc_runtime-14.29.30133.data\data\msvcp140.dll'
          Write-Output "$dll $((Get-Item $dll).VersionInfo.FileVersion)"
          "UHH_OLD_MSVCP=$dll" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: regress.py ${{ matrix.units }}
        run: python -u scripts/ci_shards.py run --arch ${{ matrix.arch }} --units "${{ matrix.units }}" --bin build-${{ matrix.arch }}/Release --out ci-logs --name ${{ matrix.name }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-${{ matrix.name }}
          path: ci-logs/
          retention-days: 14

  summary:
    needs: [plan, build, test, cet-hw]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: logs-*
          path: all-logs
      - name: Table (shard x arch) and measured unit times
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          IMAGE: ${{ needs.plan.outputs.image }}
        run: python3 scripts/ci_shards.py summarize --dir all-logs --matrix "$MATRIX" --est-out unit-times.json
      - uses: actions/upload-artifact@v6
        with:
          name: unit-times
          path: unit-times.json

